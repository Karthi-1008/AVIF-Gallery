name: Build Android TV APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:   # lets you press "Run workflow" manually

permissions:
  contents: write      # needed to attach the APK to a GitHub Release on tags

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Universal release APK (all CPU types), signed with the debug key so it installs directly.
      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Collect Release APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/PrismGallery-release.apk
          ls -la dist

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: PrismGallery-Release-APK
          path: dist/PrismGallery-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PrismGallery-release.apk
