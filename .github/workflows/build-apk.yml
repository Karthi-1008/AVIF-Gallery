name: Build Android TV APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:   # lets you press "Run workflow" manually

permissions:
  contents: write      # needed to attach the APK to a GitHub Release on tags

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Universal release APK (all CPU types), signed with the debug key so it installs directly.
      - name: Build release APK
        id: release
        continue-on-error: true
        run: ./gradlew assembleRelease --stacktrace

      # Fallback / extra: unminified debug APK (bigger, but always works).
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/PrismGallery-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/PrismGallery-release.apk
          fi
          ls -la dist

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: PrismGallery-APK
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
